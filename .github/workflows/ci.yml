name: CI

# The lane gate (HC-001): every pull request into main runs these ten jobs.
#
# The Next.js app arrives in HC-002, so most of them have nothing to check yet. Each one passes
# trivially until its own ticket makes it real, because branch protection needs green, named checks
# to require from day one. THE JOB NAMES NEVER CHANGE — that is the whole point of naming them now.
# Renaming one silently drops it from the required list and nobody finds out until something bad
# merges (fountainbridge learned this; its names have been stable since FB-001).
#
# Which ticket makes each job real:
#   Lint, Typecheck, Test, Build, Design contract  -> HC-002 (the app and design-lint)
#   Playwright UI gate                             -> real now, in HC-006
#   Copy contract                                  -> HC-009
#   Contracts parity                               -> HC-005
#   Tickets match the history, Parse tickets       -> real now, in this ticket

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint
        run: |
          if [ -f package.json ]; then
            npm ci --no-audit --no-fund
            npm run lint
          else
            echo "No app yet - lint is a no-op until HC-002 adds the Next.js app."
          fi

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Typecheck
        run: |
          if [ -f package.json ]; then
            npm ci --no-audit --no-fund
            npm run typecheck
          else
            echo "No app yet - typecheck is a no-op until HC-002 adds the Next.js app."
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test
        run: |
          if [ -f package.json ]; then
            npm ci --no-audit --no-fund
            npm test
          else
            echo "No app yet - tests are a no-op until HC-002 adds the Next.js app."
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The auth secret here is a throwaway. The build never touches a real credential; every runtime
    # secret lives in the Railway environment (CLAUDE.md #9, HC-007).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        run: |
          if [ -f package.json ]; then
            npm ci --no-audit --no-fund
            npm run build
          else
            echo "No app yet - build is a no-op until HC-002 adds the Next.js app."
          fi
        env:
          AUTH_SECRET: build-time-placeholder-not-a-real-secret
          AUTH_TRUST_HOST: "true"

  e2e:
    name: Playwright UI gate
    runs-on: ubuntu-latest
    # A REQUIRED check from the first pull request, deliberately. Fountainbridge left it advisory,
    # a red one merged itself, and FB-124 shipped a studio with two navigations and a 250px rail on
    # a 393px phone while lint, typecheck, 1050 tests and the build were all green. It is the only
    # gate that sees a screen. HC-006 makes it real.
    #
    # FB-114: a job with no timeout ran to GitHub's six-hour ceiling twice in one day when the
    # browser install wedged. The job is bounded at 20 minutes, and the step that does the work is
    # bounded inside that, so a wedged install fails fast and cheap rather than slowly.
    #
    # NO `--with-deps` ON THE INSTALL, EVER. The ubuntu-latest runner already carries chromium's
    # libraries, so only the browser download is needed. `--with-deps` runs apt, and an unreachable
    # Ubuntu mirror then turns this gate red for a reason that is not a fact about this repository.
    # Fountainbridge spent a whole 8-minute budget on `Ign: azure.archive.ubuntu.com` retries before
    # removing it (FB-114, amended 2026-08-19). If a library ever is missing, the tests fail in
    # seconds with a loader error naming it, which is a better failure than apt retrying a mirror.
    #
    # THE BROWSER CACHE IS KEYED ON THE PLAYWRIGHT VERSION, not on the lockfile hash and not on a
    # fixed string. Each @playwright/test release pins the exact Chromium build it was tested
    # against. A key that survives a version bump hands the new Playwright the old browser, and the
    # failure that follows is a real red gate about nothing - which is the worst kind, because the
    # next person learns to re-run it. Missing the cache on a bump costs about 30 seconds.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        timeout-minutes: 5
        run: npm ci --no-audit --no-fund

      # Read from the tree npm ci just produced, so the key is the version that will actually run.
      # Reading package.json instead would give a RANGE ("^1.5.0"), and every version inside that
      # range would share one cache entry, which is precisely the bug this key exists to avoid.
      - name: Work out which Playwright is installed
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore the browser cache
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Guarded on a miss. NO `--with-deps` (see above).
      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: npx playwright install chromium

      # The gate builds the app itself, through playwright.config.ts's webServer, because the
      # ceilings are readings of the PRODUCTION build. `next dev` renders the same markup at a
      # different weight, and a reading taken against it is not the reading the ceiling means.
      - name: Run the UI gate
        timeout-minutes: 15
        run: npm run test:e2e

      # Built even when the gate fails, and especially then: a failing height is a number, and the
      # picture is how somebody decides whether the screen grew for a good reason.
      - name: Build the gallery
        if: always()
        # A REPORTING step must never be the thing that turns this gate red. If the build fell over
        # before a single screenshot was taken, the gallery has nothing to render and exits 2 - and
        # a second red X next to "Build the gallery" would send the reader looking in the wrong
        # place for a failure that is already named above it.
        continue-on-error: true
        run: npm run gallery -- --md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload UI-gate gallery (screenshots + report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-gate-gallery
          path: |
            e2e/__screenshots__/
            playwright-report/
          if-no-files-found: ignore

  design:
    name: Design contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Tokens only, one status vocabulary, no dead controls. Pure Node, no install: it reads app/
    # and components/ when they exist. HC-002 makes it real.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enforce the design contract
        run: make design-lint

  copy:
    name: Copy contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The plain-English rules a machine can check (docs/STYLE-VOICE.md). HC-009 makes it real.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enforce the copy contract
        run: make copy-lint

  ticket-drift:
    name: Tickets match the history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Needs the FULL history: the check reads every commit on main to see what shipped, and a
    # shallow clone would silently find nothing and pass (fountainbridge FB-070).
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Check tickets against what shipped
        run: make ticket-drift

  contracts-parity:
    name: Contracts parity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The vendored bcap-contracts schemas must regenerate to exactly the TypeScript in the tree.
    # Both studios hand-wrote their types and both drifted (CLAUDE.md #6).
    #
    # THIS JOB NEEDS `npm ci`, and HC-001 wrote it without one. The job was modelled on the design
    # contract above, which really is pure Node and reads files with no dependencies. This one
    # generates TypeScript from JSON Schema and needs the generator, so HC-005 turned it red the
    # moment it stopped being a no-op: ERR_MODULE_NOT_FOUND, in a job whose comment said no install
    # was needed. A comment describing what a job used to need is the same defect as a comment
    # describing what code used to do.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Check generated types against the schemas
        run: make contracts-parity

  tickets:
    name: Parse tickets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # docs/tickets/*.md must parse into the Ticket contract. Isolated tool (tools/ticket-parser),
    # so it needs no root package.json and no app. Real from this ticket.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse docs/tickets against the Ticket contract
        run: make parse-tickets
